# ═══════════════════════════════════════════════════════════════════════════
#  Panel ACS SKY TECH di belakang nginx (2026-10-04)
#
#  nginx menerima pengunjung di port 80 (dan 443 sesudah HTTPS dipasang), lalu
#  meneruskannya ke panel yang hanya mendengarkan di komputer ini (127.0.0.1:8081).
#
#  Pasang:
#    sudo apt install -y nginx
#    sudo cp /opt/panel-acs/tools/nginx-panel-acs.conf /etc/nginx/sites-available/panel-acs
#    sudo nano /etc/nginx/sites-available/panel-acs     # ganti server_name; cocokkan port
#    sudo ln -s /etc/nginx/sites-available/panel-acs /etc/nginx/sites-enabled/panel-acs
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Lalu beri tahu panel bahwa ia berada di belakang proxy — sunting /etc/default/panel-acs:
#    SKY_HOST=127.0.0.1
#    SKY_PROXY=1
#  dan nyalakan ulang panel:  sudo systemctl restart panel-acs
#
#  PORT PANEL: lihat SKY_PORT di /etc/default/panel-acs. Bila bukan 8081 (pemasang memilih
#  port lain karena 8081 terpakai), ganti angka pada baris proxy_pass di bawah.
#
#  HTTPS — wajib bila panel dibuka dari internet. Langkahnya ada di README bagian
#  "Memasang di belakang nginx" (certbot menambahkan sendiri bagian 443 ke berkas ini).
# ═══════════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    # Nama domain panel. Tanpa domain (dibuka lewat alamat IP): ganti menjadi
    #   server_name _;
    # dan hapus situs bawaan nginx:  sudo rm /etc/nginx/sites-enabled/default
    server_name panel.domain-anda.com;

    # Panel sendiri menolak kiriman di atas 256 KB; batas nginx cukup sedikit di atasnya.
    client_max_body_size 1m;

    # Daftar perangkat (ribuan ONU) berupa JSON besar — dimampatkan agar cepat di jaringan lambat.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8081;

        # Host ASLI beserta port-nya ($http_host, bukan $host). Panel mencocokkannya dengan
        # alamat di browser untuk menolak permintaan dari situs lain; bila tidak sama,
        # login dan semua tombol ditolak dengan "permintaan lintas situs".
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;

        # Alamat asli pengunjung — KEDUA baris wajib ada. Tanpa ini semua orang tercatat
        # sebagai 127.0.0.1: Log tidak berguna, dan salah ketik password beberapa orang
        # mengunci login untuk semua. (Panel hanya mempercayai header ini bila keduanya
        # menyebut alamat yang sama; lihat _client_ip di backend/server.py.)
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Perintah ke ONU bisa menunggu jawaban GenieACS sampai ±1 menit, pembaruan panel
        # (tombol Update) sampai ±3 menit. Di bawah itu nginx memutus dengan 504.
        proxy_connect_timeout 5s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
